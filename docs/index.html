<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyRank ML Internship Capstone Research Paper</title>
  
  <!-- Modern Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #fcfcfd;
      --bg-card: #ffffff;
      --text-main: #1d2939;
      --text-muted: #475467;
      --text-heading: #101828;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --border-color: #eaecf0;
      --code-bg: #0f172a;
      --code-text: #f8fafc;
      --shadow-sm: 0 1px 2px 0 rgba(16, 24, 40, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(16, 24, 40, 0.1), 0 2px 4px -2px rgba(16, 24, 40, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(16, 24, 40, 0.1), 0 4px 6px -4px rgba(16, 24, 40, 0.1);
      --radius: 8px;
    }

    /* Dark Mode Preferences */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0b0f19;
        --bg-card: #111827;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --text-heading: #f8fafc;
        --accent: #3b82f6;
        --accent-light: #1e293b;
        --border-color: #1f2937;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Merriweather', Georgia, serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.8;
      font-size: 1.05rem;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Banner / Navbar */
    .nav-bar {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      font-family: 'Inter', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      .nav-bar {
        background: rgba(17, 24, 39, 0.85);
      }
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-heading);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      background: var(--accent-light);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Main Container */
    .container {
      max-width: 900px;
      margin: 3rem auto;
      padding: 2.5rem 3rem;
      background-color: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }

    @media (max-width: 768px) {
      .container {
        margin: 1rem;
        padding: 1.5rem;
      }
    }

    /* Typography Polish */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Inter', sans-serif;
      color: var(--text-heading);
      font-weight: 700;
      line-height: 1.3;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.25rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.75rem;
      margin-top: 0;
    }

    h2 {
      font-size: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    h3 {
      font-size: 1.25rem;
    }

    p {
      margin-bottom: 1.5rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Lists */
    ul, ol {
      margin-bottom: 1.5rem;
      padding-left: 1.75rem;
    }

    li {
      margin-bottom: 0.5rem;
    }

    /* Code & Pre Blocks */
    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9em;
      background-color: var(--accent-light);
      color: var(--accent);
      padding: 0.15em 0.4em;
      border-radius: 4px;
    }

    pre {
      background-color: var(--code-bg);
      color: var(--code-text);
      padding: 1.25rem;
      border-radius: var(--radius);
      overflow-x: auto;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    pre code {
      background: none;
      color: inherit;
      padding: 0;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--accent-light);
      color: var(--text-heading);
      font-weight: 600;
    }

    tr:hover {
      background-color: rgba(0,0,0,0.01);
    }

    /* Blockquotes */
    blockquote {
      border-left: 4px solid var(--accent);
      padding-left: 1.25rem;
      margin-left: 0;
      margin-bottom: 1.5rem;
      font-style: italic;
      color: var(--text-muted);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      margin-top: 4rem;
    }
  </style>
</head>

    </div>
